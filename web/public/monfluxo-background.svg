    <path d="M-180 742 C 220 555, 430 900, 820 750 S 1275 560, 1760 690" stroke="url(#gold)" stroke-width="3.5" opacity="0.74"/>
    <path d="M-170 780 C 230 592, 450 930, 838 778 S 1290 590, 1760 730" stroke="url(#gold)" stroke-width="1.8" opacity="0.58"/>
    <path d="M-160 820 C 235 640, 455 965, 850 820 S 1310 630, 1760 770" stroke="url(#gold)" stroke-width="1.2" opacity="0.46"/>
  </g>

