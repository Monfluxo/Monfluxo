<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020202"/><stop offset=".48" stop-color="#080705"/><stop offset="1" stop-color="#020202"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7f5524" stop-opacity="0"/><stop offset=".16" stop-color="#d99b42"/><stop offset=".38" stop-color="#ffe7ad"/><stop offset=".58" stop-color="#c8812d"/><stop offset=".82" stop-color="#f5c66e"/><stop offset="1" stop-color="#8e5d27" stop-opacity="0"/></linearGradient>
