    <circle cx="1320" cy="162" r="1.3"/><circle cx="1406" cy="207" r="1.1"/><circle cx="1505" cy="132" r="1.6"/>
    <circle cx="116" cy="820" r="1.4"/><circle cx="212" cy="760" r="1.2"/><circle cx="321" cy="867" r="1"/>
    <circle cx="1260" cy="772" r="1.2"/><circle cx="1398" cy="838" r="1.5"/><circle cx="1510" cy="731" r="1"/>
