<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.52" stop-color="#090806"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f6d2f" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#d59a48" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#ffe1a5" stop-opacity="0.96"/>
      <stop offset="0.64" stop-color="#c88936" stop-opacity="0.82"/>
      <stop offset="0.84" stop-color="#f2c774" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#9f6d2f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8288" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#d8dde2" stop-opacity="0.58"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.72" stop-color="#aeb4ba" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#7c8288" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSilver" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d89b46" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#d89b46" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8dde2" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d8dde2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="1360" cy="130" rx="420" ry="260" fill="url(#warm)"/>
  <ellipse cx="210" cy="790" rx="440" ry="300" fill="url(#cool)"/>

